<figure class="fig wide">
<svg viewBox="0 0 470 372" role="img" aria-label="一场仗从哪来、打完去哪：在大地图上碰上看得见的敌人就开打；打赢了拿经验和掉落，升级加点、挑奖励、换装备，接着在地图上走；输了或者逃跑，回到上次祈祷的圣龛，三个人回满血，再回地图去。">
<defs><marker id="ahC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0 L10 5 L0 10 z"/></marker></defs>
<rect class="n" x="100" y="14" width="220" height="56" rx="6"/>
<text class="t" x="210" y="38" text-anchor="middle">大地图</text>
<text class="s" x="210" y="58" text-anchor="middle">看得见的敌人，靠近会追</text>
<line class="e" x1="210" y1="70" x2="210" y2="108" marker-end="url(#ahC)"/>
<text class="el" x="220" y="94">碰上</text>
<rect class="n-key" x="100" y="110" width="220" height="56" rx="6"/>
<text class="t" x="210" y="134" text-anchor="middle">战斗</text>
<text class="s" x="210" y="154" text-anchor="middle">血带出战斗，不回满</text>
<line class="e" x1="210" y1="166" x2="210" y2="204" marker-end="url(#ahC)"/>
<text class="el" x="220" y="190">打赢</text>
<rect class="n" x="100" y="206" width="220" height="56" rx="6"/>
<text class="t" x="210" y="230" text-anchor="middle">经验和掉落</text>
<text class="s" x="210" y="250" text-anchor="middle">银币、药，有时一件装备</text>
<line class="e" x1="210" y1="262" x2="210" y2="300" marker-end="url(#ahC)"/>
<rect class="n" x="100" y="302" width="220" height="56" rx="6"/>
<text class="t" x="210" y="326" text-anchor="middle">升级加点、挑奖励</text>
<text class="s" x="210" y="346" text-anchor="middle">换上新装备</text>
<path class="e" d="M100 330 C 30 330, 30 42, 98 42" marker-end="url(#ahC)"/>
<text class="el" x="20" y="182" text-anchor="middle">接着</text>
<text class="el" x="20" y="200" text-anchor="middle">走</text>
<path class="e" d="M320 138 C 395 138, 395 160, 395 300" marker-end="url(#ahC)"/>
<text class="el" x="388" y="232" text-anchor="end">输了或逃跑</text>
<rect class="n" x="345" y="302" width="110" height="56" rx="6"/>
<text class="t" x="400" y="326" text-anchor="middle">圣龛</text>
<text class="s" x="400" y="346" text-anchor="middle">三人回满血</text>
<path class="e" d="M435 302 C 435 120, 435 42, 322 42" marker-end="url(#ahC)"/>
<text class="el" x="441" y="196">再</text>
<text class="el" x="441" y="214">去</text>
</svg>
<figcaption>打赢了血不回满，升级时才回满；血不够就回圣龛。打死的敌人不回来，所以每一仗都只能打一次。</figcaption>
</figure>
