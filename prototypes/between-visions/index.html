<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>两次看水面之间 · 原型</title>
<!--
  原型，不进正式代码。要回答的问题：两次看水面之间，照《Vampire's Fall 2》在地图上打明雷、升级、换装备，
  玩家会不会自己找事做（计划见 PLAN.md）。战斗照《杀戮尖塔》的意图规则：显示的伤害已算进力量、虚弱、易伤；
  虚弱 ×0.75、易伤 ×1.5，乘完才向下取整；格挡在自己回合开始时清零（照 mechanics-library intent-battle）。
  地图照 overworld-grid：敌人看得见，4 格内 65% 概率追一步，碰上开战，逃跑回神龛，神龛祷告回满血、普通敌人回来。
  数随手定，美术是色块。
-->
<style>
:root {
  --bg: #0f1612; --panel: #17211b; --panel2: #1f2c24; --line: #31443a;
  --fg: #e7ede5; --dim: #97a89b; --gold: #dcb75c; --gold-soft: #3a3220;
  --red: #e0705f; --red-soft: #3b2220; --blue: #79aee0; --blue-soft: #1e3040;
  --green: #74c48f; --purple: #b294e6;
  --grass: #223420; --grass2: #263a23; --tree: #0a110b; --water: #1c3a55;
  --font: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font); }
body { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 10px 24px; }
button { font: inherit; color: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2); border-radius: 6px; padding: .45rem .8rem; }
button:hover:not(:disabled) { border-color: var(--gold); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: 600; }
#app { max-width: 760px; margin: 0 auto; display: grid; gap: 10px; }
.tag { font-size: .72rem; letter-spacing: .06em; color: var(--dim); }

/* 顶栏 */
#hud { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
#hud .lv { font-weight: 700; color: var(--gold); }
.xpbar { width: 110px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.xpbar i { display: block; height: 100%; background: var(--gold); }
.mini { display: flex; gap: 8px; flex-wrap: wrap; }
.mini span { font-size: .82rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.mini b { color: var(--fg); font-weight: 500; }
.sp { background: var(--gold); color: #1a1408; border-radius: 999px; padding: 0 .5rem; font-size: .78rem; font-weight: 700; }
#hud .grow { flex: 1; }

/* 地图 */
#map { display: grid; grid-template-columns: repeat(16, 1fr); gap: 1px; background: #0a0f0c; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; touch-action: manipulation; user-select: none; }
.c { aspect-ratio: 1; position: relative; display: grid; place-items: center; font-size: clamp(9px, 2.4vw, 14px); font-weight: 700; }
.c.g { background: var(--grass); } .c.g.alt { background: var(--grass2); }
.c.t { background: var(--tree); } .c.w { background: var(--water); }
.c.s { background: var(--blue-soft); color: var(--blue); }
.c.o { background: #2a2140; color: var(--purple); }
.c.path::after { content: ""; position: absolute; inset: 38%; border-radius: 50%; background: rgba(220,183,92,.35); }
.c .pc { width: 78%; height: 78%; border-radius: 50%; background: var(--gold); color: #1a1408; display: grid; place-items: center; }
.c .en { width: 80%; height: 80%; border-radius: 4px; background: var(--red); color: #210c08; display: grid; place-items: center; }
.c .en.elite { background: #f08a3a; box-shadow: 0 0 0 2px #f6c37a inset; }
.c .en.chase::before { content: "!"; position: absolute; top: -2px; right: 2px; color: var(--gold); font-size: 1.1em; }
#hint { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: .9rem; color: var(--dim); }
#hint b { color: var(--fg); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: .78rem; }
.legend i { display: inline-block; width: .8em; height: .8em; border-radius: 2px; vertical-align: -.05em; margin-right: 4px; }

/* 战斗 */
.battle { display: grid; gap: 10px; }
.row { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; min-width: 0; }
.card.dead { opacity: .35; }
.card.pick { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold-soft); cursor: pointer; }
.card.cur { border-color: var(--gold); }
.card .nm { font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
.hp { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; position: relative; }
.hp i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); }
.hp i.loss { background: var(--red); opacity: .7; }
.enemy .hp i:not(.loss) { background: var(--red); }
.enemy .hp i.loss { background: var(--gold); }
.nums { font-size: .8rem; color: var(--dim); font-variant-numeric: tabular-nums; display: flex; gap: 8px; flex-wrap: wrap; }
.nums b { color: var(--fg); font-weight: 500; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { font-size: .72rem; padding: 0 .4rem; border-radius: 999px; background: var(--panel2); color: var(--dim); border: 1px solid var(--line); }
.chip.blk { color: var(--blue); border-color: var(--blue); }
.chip.bad { color: var(--red); border-color: var(--red); }
.chip.str { color: var(--gold); border-color: var(--gold); }
.intent { font-size: .86rem; padding: 3px 6px; border-radius: 6px; background: var(--red-soft); color: #f3c0b6; }
.intent.calm { background: var(--panel2); color: var(--dim); }
.intent .n { font-weight: 700; color: #fff; }
.next { font-size: .74rem; color: var(--dim); }
.pv { font-size: .8rem; color: var(--gold); min-height: 1.2em; }
.plan { font-size: .82rem; color: var(--gold); min-height: 1.2em; }
.steps { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: .8rem; color: var(--dim); }
.steps .on { color: var(--gold); }
.log { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-height: 2.4em; font-size: .9rem; }
.acts { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; }
.acts .btns { display: flex; flex-wrap: wrap; gap: 6px; }
.acts .btns button { display: grid; text-align: left; line-height: 1.3; }
.acts .btns button small { color: var(--dim); font-size: .74rem; }
.acts .bottom { display: flex; gap: 6px; flex-wrap: wrap; justify-content: space-between; }
.mana { color: var(--blue); font-variant-numeric: tabular-nums; }

/* 弹窗 */
#modal { position: fixed; inset: 0; background: rgba(5,8,6,.78); display: grid; place-items: center; z-index: 20; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#modal[hidden] { display: none; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: min(560px, 100%); max-height: 90vh; overflow: auto; display: grid; gap: 10px; }
.box h2 { margin: 0; font-size: 1.15rem; }
.box p { margin: 0; }
.box .story p + p { margin-top: .6rem; }
.box .story { font-family: "Songti SC", "STSong", "Noto Serif SC", serif; font-size: 1.02rem; line-height: 1.9; }
.box .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.box .choices { display: grid; gap: 8px; }
.box .choices button { text-align: left; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
.item .r0 { color: var(--fg); } .item .r1 { color: var(--blue); } .item .r2 { color: var(--gold); }
.item small { color: var(--dim); }
.delta { font-size: .82rem; } .delta .up { color: var(--green); } .delta .down { color: var(--red); }
.tabs { display: flex; gap: 6px; }
.tabs button.on { border-color: var(--gold); color: var(--gold); }
.tree { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tree .col { display: grid; gap: 6px; align-content: start; }
.tree .col h3 { margin: 0; font-size: .9rem; color: var(--dim); font-weight: 500; }
.node { text-align: left; display: grid; gap: 2px; padding: 6px 8px; font-size: .82rem; line-height: 1.35; }
.node b { font-size: .88rem; }
.node.own { border-color: var(--gold); background: var(--gold-soft); }
.node.can { border-color: var(--green); }
@media (max-width: 480px) { .tree { grid-template-columns: 1fr; } }
table.m { border-collapse: collapse; width: 100%; font-size: .88rem; }
table.m td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
table.m td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
details.obs { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: .82rem; color: var(--dim); }
details.obs summary { cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { .flash { animation: fl .45s ease-out; } @keyframes fl { from { background: var(--gold-soft); } } }
.box .story p.say { display: flex; gap: .55rem; align-items: baseline; }
.nm { font-family: var(--font); font-size: .78rem; font-weight: 700; line-height: 1.7; padding: 0 .45rem; border-radius: 3px; color: #fff; flex: none; }
.nm.kay { background: #8e2a2a; } .nm.ar { background: #5b3a8c; } .nm.mer { background: #5f6670; } .nm.ec { background: #3d5a45; }
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="view"></div>
  <details class="obs" id="obs"><summary>试玩记录（玩完把这里的数告诉我）</summary><div id="obsBody"></div></details>
</div>
<div id="modal" hidden></div>
<script>
'use strict';
// ================= 数据：规则照原作，数随手定 =================
const RULES = { weak: 0.75, vuln: 1.5 };          // 杀戮尖塔：虚弱 ×0.75（出手的人），易伤 ×1.5（挨打的人）
const CHASE = { radius: 4, chance: 0.65, wander: 2, grace: 3 };  // overworld-grid 的默认数（Vampire's Fall 2，追击概率未核实）
const XP_NEED = L => 30 + 20 * L;                 // 原型自定：1→2 要 50，2→3 要 70，3→4 要 90
const MAP_ROWS = [
  '################',
  '#P..#......T...#',
  '#...#..TT..T.~~#',
  '#.......T.....O#',
  '#.TT..S....TT..#',
  '#..T......T....#',
  '#......TT...T..#',
  '#.T..T.....T...#',
  '#....T..TT....~#',
  '#..............#',
  '################',
];
const W = 16, H = 11;
const SOLID = '#T~';
const NAMES = { ap: '你', kay: '凯', ar: '亚瑟' };
const ENEMY = {
  wolf:   { name: '狼',   hp: 6,  kind: 'wolf', xp: 10, pattern: [{ t: 'atk', d: 3, to: 'low' }] },
  grey:   { name: '灰狼', hp: 7,  kind: 'wolf', xp: 10, pattern: [{ t: 'atk', d: 3, to: 'kay' }, { t: 'atk', d: 3, to: 'ar' }] },
  howler: { name: '瘦狼', hp: 5,  kind: 'wolf', xp: 12, pattern: [{ t: 'atk', d: 2, to: 'ap' }, { t: 'summon', what: 'wolf' }] },
  leader: { name: '头狼', hp: 18, kind: 'wolf', xp: 30, pattern: [{ t: 'atk', d: 4, to: 'ar' }, { t: 'buff', str: 1 }, { t: 'atk', d: 3, hits: 2, to: 'kay' }] },
  bandit: { name: '强盗', hp: 9,  kind: 'man',  xp: 15, pattern: [{ t: 'atk', d: 4, to: 'kay' }, { t: 'weak', n: 2, to: 'kay' }, { t: 'atk', d: 4, to: 'low' }] },
  archer: { name: '弓手', hp: 6,  kind: 'man',  xp: 15, pattern: [{ t: 'atk', d: 2, hits: 2, to: 'ap' }, { t: 'def', b: 4 }] },
};
const SPOTS0 = [
  { enc: ['wolf'], cell: [8, 1], label: '狼' },
  { enc: ['wolf', 'grey'], cell: [3, 7], label: '狼' },
  { enc: ['howler', 'wolf'], cell: [9, 5], label: '狼' },
  { enc: ['bandit', 'archer'], cell: [12, 8], label: '盗' },
  { enc: ['leader', 'grey', 'howler'], cell: [12, 3], label: '头', elite: true },
];
const TREE = [
  { name: '体魄', nodes: [
    { k: 'v1', name: '结实', text: '全队最大生命 +3' },
    { k: 'v2', name: '护身加厚', text: '护身多挡 2' },
    { k: 'v3', name: '喘口气', text: '打赢后全队回 3 血' } ] },
  { name: '法术', nodes: [
    { k: 'c1', name: '星火加热', text: '星火伤害 +1' },
    { k: 'c2', name: '深水', text: '法力上限 +2' },
    { k: 'c3', name: '打断', text: '学会打断：取消召唤和嚎叫（3 法力）' } ] },
  { name: '预见', nodes: [
    { k: 'f1', name: '多看一步', text: '敌人头上多显示下回合要做什么' },
    { k: 'f2', name: '看穿', text: '开战时所有敌人带易伤 1' },
    { k: 'f3', name: '星火压制', text: '星火让目标虚弱 1' } ] },
];
const SLOT = { kay: '凯的剑', ar: '亚瑟的剑', ap: '你的护符' };
const RAR = [{ name: '普通', w: 60, bonus: 0, aff: 0 }, { name: '精良', w: 30, bonus: 1, aff: 1 }, { name: '稀有', w: 10, bonus: 2, aff: 2 }];
const AFFIX = [
  { k: 'tough', text: '持有者最大生命 +3' },
  { k: 'sharp', text: '持有者伤害 +1' },
  { k: 'first', text: '每场第一回合格挡 +3' },
  { k: 'spring', text: '你的法力上限 +1' },
  { k: 'hunter', text: '打狼类伤害 +2' },
];

// ================= 随机数：带种子 =================
let seed = (Date.now() ^ 0x9e3779b9) >>> 0;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const pickW = list => { let s = list.reduce((a, x) => a + x.w, 0), r = rnd() * s; for (const x of list) { if ((r -= x.w) < 0) return x; } return list[list.length - 1]; };

// ================= 状态 =================
let S, B = null;
function fresh() {
  let start = [1, 1];
  MAP_ROWS.forEach((r, y) => { const x = r.indexOf('P'); if (x >= 0) start = [x, y]; });
  S = {
    pos: start, level: 1, xp: 0, sp: 0, nodes: {}, gear: { kay: null, ar: null, ap: null }, bag: [], uidItem: 0,
    hp: { ap: 14, kay: 16, ar: 13 }, grace: 0, mode: 'map', path: [],
    spots: SPOTS0.map((s, i) => ({ i, enc: s.enc, home: s.cell.slice(), cell: s.cell.slice(), alive: true, elite: !!s.elite, label: s.label, chasing: false })),
    shrine: findTile('S'), lastShrine: findTile('S'),
    m: { start: Date.now(), firstFight: null, active: 0, caught: 0, wins: 0, flees: 0, losses: 0, levels: 0, treeMs: 0, lootMs: 0, equips: 0, prays: 0, steps: 0, eliteWin: false, choice: null, end: null },
  };
}
function findTile(ch) { for (let y = 0; y < H; y++) { const x = MAP_ROWS[y].indexOf(ch); if (x >= 0) return [x, y]; } return null; }
const tile = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? '#' : MAP_ROWS[y][x];
const solid = (x, y) => SOLID.includes(tile(x, y));
const has = k => !!S.nodes[k];
const man = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]);
const eq = (a, b) => a[0] === b[0] && a[1] === b[1];
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

// ---- 派生数值：界面和战斗都只调这几个函数 ----
function affixCount(id, k) { const it = S.gear[id]; return it ? it.aff.filter(a => a === k).length : 0; }
function affixAll(k) { return ['ap', 'kay', 'ar'].reduce((a, id) => a + affixCount(id, k), 0); }
function maxHp(id) { return { ap: 14, kay: 16, ar: 13 }[id] +   // 2026-11-06 和「怎么打」一起调：最后一场「招招致死」
   2 * (S.level - 1) + (has('v1') ? 3 : 0) + 3 * affixCount(id, 'tough'); }
function weaponBonus(id) { const it = S.gear[id]; return it ? it.base : 0; }
function atk(id) { return { kay: 3, ar: 2 }[id] + weaponBonus(id) + affixCount(id, 'sharp'); }
function sparkDmg() { return 2 + (has('c1') ? 1 : 0) + weaponBonus('ap') + affixCount('ap', 'sharp'); }
function wardAmt() { return 4 + (has('v2') ? 2 : 0); }
function manaMax() { return 6 + (has('c2') ? 2 : 0) + affixAll('spring'); }

// ================= 战斗（照杀戮尖塔的意图规则） =================
function hit(base, src, tgt) {
  let d = base + (src.str || 0);
  if (src.weak > 0) d *= RULES.weak;
  if (tgt.vuln > 0) d *= RULES.vuln;
  return Math.max(0, Math.floor(d + 1e-6));   // 乘完才取整
}
function absorb(t, d) { const bl = Math.min(t.block, d); t.block -= bl; const lost = d - bl; t.hp = Math.max(0, t.hp - lost); return [bl, lost]; }
function mkEnemy(b, k) { const d = ENEMY[k]; return { uid: ++b.uid, key: k, name: d.name, kind: d.kind, xp: d.xp, hp: d.hp, max: d.hp, block: 0, str: 0, weak: 0, vuln: 0, pi: 0, intent: null, next: null }; }
const clone = o => JSON.parse(JSON.stringify(o));
function alivePartyLow(b) { const a = b.party.filter(p => p.hp > 0); return a.length ? a.reduce((x, c) => c.hp < x.hp ? c : x) : null; }
function pickTarget(b, to) {
  if (to === 'low') { const p = alivePartyLow(b); return p ? p.id : null; }
  const p = b.party.find(x => x.id === to);
  if (p && p.hp > 0) return to;
  const l = alivePartyLow(b); return l ? l.id : null;
}
function rollIntent(b, e) {
  const pat = ENEMY[e.key].pattern;
  const it = Object.assign({}, pat[e.pi % pat.length]); e.pi++;
  if (it.to) it.to = pickTarget(b, it.to);
  e.intent = it;
  e.next = Object.assign({}, pat[e.pi % pat.length]);
}
function newBattle(spotIdx) {
  const spot = S.spots[spotIdx];
  const b = { spot: spotIdx, elite: spot.elite, turn: 0, enemies: [], party: [], mana: manaMax(), manaMax: manaMax(), plans: {}, uid: 0, over: null, log: '' };
  spot.enc.forEach(k => b.enemies.push(mkEnemy(b, k)));
  ['ap', 'kay', 'ar'].forEach(id => b.party.push({ id, name: NAMES[id], hp: Math.min(S.hp[id], maxHp(id)), max: maxHp(id), block: 0, weak: 0, vuln: 0, str: 0 }));
  if (has('f2')) b.enemies.forEach(e => e.vuln = 1);
  startPlayerTurn(b);
  b.party.forEach(p => { const f = 3 * affixCount(p.id, 'first'); if (f && p.hp > 0) p.block += f; });
  return b;
}
function startPlayerTurn(b) {
  b.turn++;
  b.party.forEach(p => p.block = 0);                 // 格挡在自己回合开始时清零
  if (b.turn > 1) b.mana = Math.min(b.manaMax, b.mana + 1);
  b.enemies.forEach(e => { if (e.hp > 0) rollIntent(b, e); });
  b.plans = {};
}
function partyActs(id) {
  if (id === 'ap') {
    const a = [
      { k: 'spark', name: '星火', cost: 1, target: 'enemy', desc: () => `${sparkDmg()} 伤害，易伤 1${has('f3') ? '、虚弱 1' : ''}` },
      { k: 'ward', name: '护身', cost: 2, target: 'ally', desc: () => `给一个人挡 ${wardAmt()}` },
      { k: 'focus', name: '凝神', cost: 0, target: null, desc: () => '回 2 法力' },
    ];
    if (has('c3')) a.push({ k: 'interrupt', name: '打断', cost: 3, target: 'enemy', desc: () => '取消召唤、嚎叫' });
    return a;
  }
  return [
    { k: 'attack', name: '砍', cost: 0, target: 'enemy', desc: () => `${atk(id)} 伤害` },
    { k: 'defend', name: '举盾', cost: 0, target: null, desc: () => '挡 3' },
  ];
}
function attackBase(b, p, tgt) {
  const base = p.id === 'ap' ? sparkDmg() : atk(p.id);

    <p class="say"><b class="nm mer">梅林</b><span>看水。</span></p>
    <p>他说完这两个字，就不再开口。</p>
    <p>中间那块平石凹下去一个浅坑，积水上结了层薄冰，冰下压着两片橡树叶。你摸了摸怀里的木碗，没拿出来，跪在石边往冰里看。苔藓又冷又硬，硌着膝盖。</p>
    <p>冰面先映出你自己的脸。眨一下眼，脸没了。</p>
    <p>雪。伦敦教堂的院子，人挤着人。一块石头上插着一把剑，亚瑟握上去，剑出来得很轻，轻得他自己先愣了一下。</p>
    <p>换了一幕。凯站在埃克托爵士面前，那把剑横在他手上，嗓子发紧。</p>
    <p class="say"><b class="nm kay">凯</b><span>是我拔的。</span></p>
    <p>冰下的橡树叶转了半圈。</p>
    <p class="say"><b class="nm mer">梅林</b><span>看见什么了？</span></p>
    <p>没等你张嘴，他已经转身往回走，杖尖在冻土上一下一下地敲。</p></div>
    <p><b>这件事，说给谁听？</b></p>
    <div class="choices">
      <button data-c="凯">提醒凯：“到了伦敦，不管发生什么，别对父亲说谎。”</button>
      <button data-c="亚瑟">告诉亚瑟：“凯会说那把剑是他拔的。”</button>
      <button data-c="谁都不说">谁都不说。</button>
    </div>`, []);
  document.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { S.m.choice = b.dataset.c; endCard(); });
}
function endCard() {
  S.m.end = Math.round((Date.now() - S.m.start) / 1000);
  const left = S.spots.filter(s => s.alive).length;
  modal(`<h2>原型到这里结束</h2>
    <p>第 2 章，这一幕会照着发生。你选的是：${S.m.choice}。</p>
    ${metricsTable(left)}
    <p class="tag">玩完回聊天里告诉我：哪一刻让你想去打下一只，哪一刻觉得没意思。</p>`,
    [{ label: '再来一次', primary: true, fn: () => { fresh(); document.getElementById('modal').hidden = true; S.mode = 'map'; renderMap(); intro(); } }]);
}
function metricsTable(left) {
  const m = S.m, sec = s => s >= 60 ? `${Math.floor(s / 60)} 分 ${s % 60} 秒` : `${s} 秒`;
  const rows = [
    ['用时', sec(m.end ?? Math.round((Date.now() - m.start) / 1000))],
    ['第一次开打在第几秒', m.firstFight === null ? '没打' : sec(m.firstFight)],
    ['自己撞上去开打', m.active], ['被追上开打', m.caught], ['打赢', m.wins], ['逃跑', m.flees], ['输了', m.losses],
    ['打了头狼', m.eliteWin ? '打了' : '没打'], ['升级', m.levels], ['加点那一屏停了', sec(Math.round(m.treeMs / 1000))],
    ['看掉落那一屏停了', sec(Math.round(m.lootMs / 1000))], ['换装备', m.equips], ['圣龛祷告', m.prays],
  ];
  if (left !== undefined) rows.push(['走到石圈时还没打的敌人', left]);
  return `<table class="m">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
}
function intro() {
  S.mode = 'menu';
  modal(`<p class="tag">原型 · 色块 · 不进正式游戏</p><h2>第 1 章 · 庄园北边的林子</h2>
    <div class="story"><p>冬天的黄昏，羊圈的栅栏上挂着白霜。凯数了两遍羊，脸拉了下来。</p>
    <p class="say"><b class="nm kay">凯</b><span>少一只。狼叼的。</span></p>
    <p>他往腰上一摸，剑不在。亚瑟从马厩那头跑过来，把剑塞进他手里，手背上还沾着马毛。</p>
    <p class="say"><b class="nm ar">亚瑟</b><span>又落在草料堆上了。</span></p>
    <p class="say"><b class="nm kay">凯</b><span>我们的小侍从记性真好。天黑前找回来。谁拖后腿，谁今晚刷马。</span></p>
    <p>他把剑挂上，抬下巴指了指林子。梅林早上叮嘱过你，天黑前去一趟东边的石圈。</p></div>
    <p><b>走到东边的石圈去，梅林在那儿等你。</b>林子里的东西你都看得见，靠近了会追你。蓝色的是路边的圣龛，能歇脚。</p>
    <p class="tag">方向键或 WASD 走一格；也可以直接点地面。</p>`, [{ label: '出发', primary: true, fn: () => { S.m.start = Date.now(); closeModal(); } }]);
}

// ================= 画面 =================
function setHint(t) { const h = document.getElementById('hintText'); if (h) h.innerHTML = t; }
function renderHud() {
  const need = XP_NEED(S.level);
  document.getElementById('hud').innerHTML = `<span class="lv">${S.level} 级</span><span class="xpbar" title="经验 ${S.xp}/${need}"><i style="width:${Math.min(100, S.xp / need * 100)}%"></i></span>
    <span class="mini">${['ap', 'kay', 'ar'].map(id => `<span>${NAMES[id]} <b>${S.hp[id]}/${maxHp(id)}</b></span>`).join('')}</span>
    <span class="grow"></span>${S.sp ? `<span class="sp">${S.sp} 技能点</span>` : ''}<button id="partyBtn">队伍</button>`;
  document.getElementById('partyBtn').onclick = () => { if (S.mode === 'map') openParty(S.sp ? 'tree' : 'gear'); };
  document.getElementById('obsBody').innerHTML = metricsTable();
}
function renderMap() {
  renderHud();
  if (S.mode === 'battle') return;
  const v = document.getElementById('view');
  let g = '<div id="map" role="grid" aria-label="森林地图">';
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const ch = tile(x, y);
    const cls = ch === 'T' || ch === '#' ? 't' : ch === '~' ? 'w' : ch === 'S' ? 's' : ch === 'O' ? 'o' : 'g' + ((x + y) % 2 ? ' alt' : '');
    const onPath = S.path.some(c => c[0] === x && c[1] === y);
    let inner = ch === 'S' ? '龛' : ch === 'O' ? '石' : '';
    if (eq(S.pos, [x, y])) inner = '<span class="pc">你</span>';
    const e = enemyAt([x, y]);
    if (e) inner = `<span class="en ${e.elite ? 'elite' : ''} ${e.chasing ? 'chase' : ''}" title="${e.enc.map(k => ENEMY[k].name).join('、')}">${e.label}</span>`;
    g += `<div class="c ${cls}${onPath ? ' path' : ''}" data-x="${x}" data-y="${y}"></div>`.replace('></div>', `>${inner}</div>`);
  }
  g += '</div>';
  v.innerHTML = g + `<div id="hint"><span id="hintText">走到东边的<b>石圈</b>去看水面。</span>
    <div class="legend"><span><i style="background:var(--gold)"></i>你们</span><span><i style="background:var(--red)"></i>狼、强盗（! = 在追你）</span><span><i style="background:#f08a3a"></i>头狼，不动</span><span><i style="background:var(--blue-soft);border:1px solid var(--blue)"></i>圣龛</span><span><i style="background:#2a2140;border:1px solid var(--purple)"></i>石圈</span></div></div>`;
  document.getElementById('map').onclick = ev => { const c = ev.target.closest('.c'); if (c) walkTo([+c.dataset.x, +c.dataset.y]); };
}
function hpBar(cur, max, after) {
  const w = v => Math.max(0, Math.min(100, v / max * 100));
  return `<div class="hp">${after !== undefined && after < cur ? `<i class="loss" style="width:${w(cur)}%"></i><i style="width:${w(after)}%"></i>` : `<i style="width:${w(cur)}%"></i>`}</div>`;
}
function statusChips(u) {
  const c = [];
  if (u.block) c.push(`<span class="chip blk">挡 ${u.block}</span>`);
  if (u.vuln) c.push(`<span class="chip bad">易伤 ${u.vuln}</span>`);
  if (u.weak) c.push(`<span class="chip bad">虚弱 ${u.weak}</span>`);
  if (u.str) c.push(`<span class="chip str">力量 +${u.str}</span>`);
  return `<div class="chips">${c.join('')}</div>`;
}
function renderBattle(view, text, focus) {
  renderHud();
  const b = view || B; const live = !view;
  const pv = live && Object.keys(b.plans).length ? preview(b) : null;
  const cur = live && !picking ? nextMember(b) : null;
  const pickKind = picking ? partyActs(picking.id).find(a => a.k === picking.act).target : null;
  const step = live ? (picking || cur ? 2 : 3) : 3;
  let h = `<div class="battle"><div class="steps"><span class="${step === 1 ? 'on' : ''}">① 看敌人头上的牌子</span><span class="${step === 2 ? 'on' : ''}">② 给每人选一个行动</span><span class="${step === 3 ? 'on' : ''}">③ 选完自动开打：你们先动，敌人后动</span></div>`;
  h += '<div class="row">' + b.enemies.map(e => {
    const after = pv ? (pv.enemies.find(x => x.uid === e.uid) || {}).hp : undefined;
    const sel = pickKind === 'enemy' && e.hp > 0;
    return `<div class="card enemy ${e.hp <= 0 ? 'dead' : ''} ${sel ? 'pick' : ''} ${focus === e.uid ? 'flash' : ''}" data-enemy="${e.uid}">
      <div class="nm"><span>${e.name}</span><span class="nums"><b>${e.hp}</b>/${e.max}</span></div>${hpBar(e.hp, e.max, after)}${statusChips(e)}
      ${e.hp > 0 ? `<div class="intent ${e.intent && e.intent.t !== 'atk' ? 'calm' : ''}">${intentText(b, e, e.intent)}</div>${has('f1') && e.next ? `<div class="next">下回合：${intentText(b, e, e.next, true)}</div>` : ''}` : '<div class="intent calm">倒下</div>'}
      <div class="pv">${after !== undefined && after < e.hp ? (after <= 0 ? '这回合会倒下' : `${e.hp} → ${after}`) : ''}</div></div>`;
  }).join('') + '</div>';
  h += `<div class="log">${text || b.log || ''}</div>`;
  h += '<div class="row">' + b.party.map(p => {
    const after = pv ? pv.party.find(x => x.id === p.id).hp : undefined;
    const pl = b.plans[p.id];
    const plText = pl ? partyActs(p.id).find(a => a.k === pl.k).name + (pl.target !== undefined ? ' → ' + (typeof pl.target === 'number' ? (b.enemies.find(e => e.uid === pl.target) || {}).name : NAMES[pl.target]) : '') : '';
    const sel = pickKind === 'ally' && p.hp > 0;
    return `<div class="card ally ${p.hp <= 0 ? 'dead' : ''} ${sel ? 'pick' : ''} ${cur === p.id ? 'cur' : ''} ${focus === p.id ? 'flash' : ''}" data-ally="${p.id}">
      <div class="nm"><span>${p.name}</span><span class="nums"><b>${p.hp}</b>/${p.max}</span></div>${hpBar(p.hp, p.max, after)}${statusChips(p)}
      <div class="plan">${plText}</div><div class="pv">${after !== undefined && after < p.hp ? `会挨 ${p.hp - after}：${p.hp} → ${after}` : ''}</div></div>`;
  }).join('') + '</div>';
  if (live) {
    const who = picking ? picking.id : cur;
    h += '<div class="acts">';
    if (who) {
      const acts = partyActs(who);
      h += `<div><b>${NAMES[who]}</b>${who === 'ap' ? `　<span class="mana">法力 ${b.mana}/${b.manaMax}</span>` : ''}　${picking ? (pickKind === 'enemy' ? '点一个闪着金边的敌人' : '点一个闪着金边的队友') : '选一个行动'}</div>`;
      h += '<div class="btns">' + acts.map(a => `<button data-act="${a.k}" ${a.cost > b.mana ? 'disabled' : ''} class="${picking && picking.act === a.k ? 'primary' : ''}">${a.name}${a.cost ? `（${a.cost} 法力）` : ''}<small>${a.desc()}</small></button>`).join('') + '</div>';
    } else h += '<div>出手……</div>';
    h += `<div class="bottom"><button id="redo" ${Object.keys(b.plans).length || picking ? '' : 'disabled'}>重选</button><button id="flee">逃回圣龛</button></div></div>`;
  }
  h += '</div>';
  const v = document.getElementById('view'); v.innerHTML = h;
  if (!live) return;
  v.querySelectorAll('[data-act]').forEach(el => el.onclick = () => choose(picking ? picking.id : cur, el.dataset.act));
  v.querySelectorAll('[data-enemy]').forEach(el => el.onclick = () => pickTarget2('enemy', +el.dataset.enemy));
  v.querySelectorAll('[data-ally]').forEach(el => el.onclick = () => {
    if (picking) return pickTarget2('ally', el.dataset.ally);
    const id = el.dataset.ally; const p = b.party.find(x => x.id === id);
    if (p.hp > 0 && b.plans[id]) { delete b.plans[id]; renderBattle(); }   // 点已经排好的人：重排他
  });
  const r = document.getElementById('redo'); if (r) r.onclick = () => { b.plans = {}; picking = null; renderBattle(); };
  const f = document.getElementById('flee'); if (f) f.onclick = flee;
}

// ================= 启动 =================
document.addEventListener('keydown', ev => {
  if (!document.getElementById('modal').hidden) return;
  const k = ev.key.toLowerCase();
  const d = { arrowup: [0, -1], w: [0, -1], arrowdown: [0, 1], s: [0, 1], arrowleft: [-1, 0], a: [-1, 0], arrowright: [1, 0], d: [1, 0] }[k];
  if (d && S.mode === 'map') { ev.preventDefault(); clearInterval(walkTimer); S.path = []; tryMove(d[0], d[1]); }
});
fresh(); renderMap(); intro();
window.__proto = { get S() { return S; }, get B() { return B; }, tryMove, walkTo, choose, pickTarget2, hit, preview, startFight, flee, openParty, equip, makeItem, bfs, setSeed: s => { seed = s >>> 0; } };
</script>
</body>
</html>
