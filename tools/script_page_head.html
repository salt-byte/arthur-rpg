<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>梅林的学徒（暂定） · 对白</title><style>
:root{--bg:#f6f3ec;--card:#fffdf8;--ink:#2a2620;--mute:#7a7266;--line:#e3dccd;--acc:#8a5a2b;--key:#2f6f8f;--brbg:#f1ece1;--cmd:#ece5d6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1c1a17;--card:#24211d;--ink:#e9e4da;--mute:#a49b8c;--line:#3a352e;--acc:#d39a5c;--key:#7fb8d4;--brbg:#2b2823;--cmd:#332f29}}
:root[data-theme=dark]{--bg:#1c1a17;--card:#24211d;--ink:#e9e4da;--mute:#a49b8c;--line:#3a352e;--acc:#d39a5c;--key:#7fb8d4;--brbg:#2b2823;--cmd:#332f29}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.75 "Noto Serif SC","Songti SC",serif}
.wrap{max-width:860px;margin:0 auto;padding:16px}
nav.toc{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 18px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2;border-bottom:1px solid var(--line)}
nav.toc a{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:13px;background:var(--card)}
nav.toc small{color:var(--mute);margin-left:6px}
h2{font-size:20px;margin:28px 0 10px;color:var(--acc)}h2 small{font-size:12px;color:var(--mute);font-weight:normal;margin-left:8px}
.node{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 14px}
.node header{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.node h3{margin:0;font:600 14px/1.4 ui-monospace,Menlo,monospace;color:var(--mute)}
.tag{font-size:11px;border-radius:4px;padding:0 6px;background:var(--cmd);color:var(--mute);font-family:sans-serif}
.when{margin:4px 0 0;font-size:12px;color:var(--mute);font-family:sans-serif;line-height:1.5}
.body{margin-top:8px}
.say{margin:4px 0;display:flex;gap:10px}.who{flex:0 0 auto;min-width:3.5em;font-weight:700;color:var(--acc)}.txt{flex:1}
.nar{margin:6px 0;color:var(--ink);opacity:.82}
.note{font:12px/1.5 ui-monospace,monospace;color:var(--mute);margin:4px 0}
.cmd{display:inline-block;font:12px/1.6 sans-serif;background:var(--cmd);color:var(--mute);border-radius:4px;padding:0 7px;margin:3px 4px 3px 0}
.cmd b{color:var(--ink);font-weight:600;margin-right:4px}.cmd.c-vision,.cmd.c-fight_npcs,.cmd.c-show_ending{background:var(--key);color:#fff}.cmd.c-vision b,.cmd.c-fight_npcs b,.cmd.c-show_ending b{color:#fff}
.cmd.set{background:transparent;border:1px dashed var(--line)}
.if{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:8px 0}
.br{background:var(--brbg);border-radius:6px;padding:8px 10px;min-width:0}
.cond{font:12px/1.5 sans-serif;color:var(--key);margin-bottom:4px;font-weight:600}.cond code{display:block;font-weight:normal;color:var(--mute);font-size:11px;word-break:break-all}
.opts{margin:8px 0;padding-left:1.4em}.opts>li{margin:6px 0}.opt{font-weight:600}
.opts>li.k>.opt{color:var(--key)}.badge{font:11px sans-serif;background:var(--key);color:#fff;border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.ocond{display:block;font:12px sans-serif;color:var(--mute);font-weight:normal}
.opts>li>.say,.opts>li>.nar,.opts>li>.if,.opts>li>.opts,.opts>li>.cmd{margin-left:.2em}
.empty{color:var(--mute);font-size:12px}
.vis{border-left:3px solid var(--key);padding:4px 10px;margin:6px 0;background:var(--brbg);border-radius:0 6px 6px 0}.vis b{font:12px sans-serif;color:var(--key)}.vis p{margin:2px 0;white-space:pre-line}
.lede{color:var(--mute);font-size:13px;font-family:sans-serif}
@media (max-width:560px){.say{flex-direction:column;gap:0}.who{min-width:0}nav.toc{flex-wrap:nowrap;overflow-x:auto}nav.toc a{flex:0 0 auto}}
</style></head><body><div class="wrap">
